services:
  postgres:
    image: postgres:16-alpine
    container_name: bnv-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: bnv
      POSTGRES_PASSWORD: bnvpassword
      POSTGRES_DB: bnv

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnv -d bnv"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bnv-pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bnv.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"
      
    volumes:
    - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data: